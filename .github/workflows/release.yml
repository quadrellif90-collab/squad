name: Release Zip
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create zip
        run: zip -r squad-project.zip . -x ".git/*"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: squad-project
          path: squad-project.zip
